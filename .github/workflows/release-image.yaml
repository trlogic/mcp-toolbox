name: release-image

on:
  push:
    tags:
      - "v*-es*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      IMAGE: ${{ vars.IMAGE || format('ghcr.io/{0}/mcp-toolbox', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./internal/sources/elasticsearch/

      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY && secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ vars.REGISTRY && secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_TYPE=container
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
