name: build-and-publish

on:
  push:
    tags:
      - "v*-es*"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Test
        run: go test ./internal/sources/elasticsearch/

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Resolve image tags from the git tag
        id: ver
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          ref="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="sha-${GITHUB_SHA::7}"
            tags="${image}:${version}"
            release="false"
          else
            version="${ref#v}"
            channel="${version#*-}"
            channel="${channel%%.*}"
            tags="${image}:${version},${image}:${channel}"
            release="true"
          fi

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags=${tags}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing: ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: type=raw,value=${{ steps.ver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_TYPE=container
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.ver.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: false
          body: |
            Docker image: `${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}`
